services:
  - type: web
    name: finance-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7   # psycopg2-binary has no wheels yet for the 3.14 Render defaults to
      - key: ALPHAVANTAGE_API_KEY
        sync: false   # set this manually in the Render dashboard
      - key: DATABASE_URL
        sync: false   # set this to your Supabase connection string
      - key: SECRET_KEY
        generateValue: true   # Render generates a random signing secret for login tokens
      - key: ADMIN_USERNAME
        sync: false   # the username you'll log in with
      - key: ADMIN_PASSWORD_HASH
        sync: false   # generate with: python3 -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('yourpassword'))"
      - key: FRONTEND_ORIGIN
        sync: false   # set to your deployed frontend's exact URL, e.g. https://finance-tracker-frontend.onrender.com
      - key: APP_TIMEZONE
        value: Europe/Skopje   # "today" for bill due dates
      - key: VAPID_PRIVATE_KEY
        sync: false   # bill-reminder push key; generate with: cd backend && python push.py
      - key: PUSH_CRON_SECRET
        sync: false   # random string; same value as the GitHub repo secret PUSH_CRON_SECRET

  - type: web
    name: finance-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Serve the API from the frontend's own origin. Keeps the HttpOnly login
    # cookie first-party (Safari/iOS blocks third-party cookies) so it can be
    # SameSite=Strict. Update the destination if your API URL differs.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://finance-tracker-api-aait.onrender.com/api/*
    envVars:
      - key: VITE_API_BASE
        value: /api
